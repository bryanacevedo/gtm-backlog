name = "gtm-backlog"
main = "src/server/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
account_id = "7752fe02eab8c88caa4d0b357685751f"
workers_dev = true

# The built app (vite build -> dist). Every request runs the Worker first: pages need the sign-in check,
# built files under /assets are handed straight back to the asset store.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Reload the sample backlog every night at 06:00 UTC (02:00 in Santo Domingo).
[triggers]
crons = ["0 6 * * *"]

# Migrations are bundled as text (src/server/migrations-bundle.ts).
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# The site address: Google's redirect URI is PUBLIC_URL + /auth/google/callback.
[vars]
PUBLIC_URL = "https://gtm-backlog.leandrive.workers.dev"

# Secrets, set with `wrangler secret put <NAME>` (README, Deploy to Cloudflare):
# DEMO_DATABASE_URL, DATABASE_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SESSION_SECRET,
# ALLOWED_EMAILS, WRITE_KEY, ANTHROPIC_API_KEY.
