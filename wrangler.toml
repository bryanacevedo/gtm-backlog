name = "gtm-backlog"
main = "src/server/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
account_id = "7752fe02eab8c88caa4d0b357685751f"
workers_dev = true

# The built app (vite build -> dist). /api/* runs the Worker first.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/video/*"]

# Reload the sample backlog every night at 06:00 UTC (02:00 in Santo Domingo).
[triggers]
crons = ["0 6 * * *"]

[vars]
DEMO = "1"

# Secret, set with `wrangler secret put DATABASE_URL`: the Postgres connection string.
